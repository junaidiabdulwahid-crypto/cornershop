services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64   # the official PostGIS image is Intel-only; Docker Desktop runs it via Rosetta on Apple Silicon
    environment:
      POSTGRES_USER: cornershop
      POSTGRES_PASSWORD: cornershop
      POSTGRES_DB: cornershop
    ports:
      - "54330:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # 001_init.sql, then 002_reviews.sql, on the first start
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornershop"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
